name: API Governance Check

on: [push]

jobs:
  governance-scan:
    runs-on: ubuntu-latest
    # Kita menggunakan container resmi agar tidak perlu install manual
    container:
      image: ibmcom/apic-toolkit:latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Governance Scan
        run: |
          # Di dalam container ini, perintah 'apic' sudah otomatis terinstal
          apic governance:validate --server <alamat-server-anda> --api jsonplaceholder.yaml --ruleset <nama-ruleset-anda>
